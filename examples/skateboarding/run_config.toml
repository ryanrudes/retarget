# Skateboarding introduction example — run from this directory after fuse_motion.py:
#   uv run python fuse_motion.py
#   uv run retarget run --config run_config.toml
#   uv run retarget evaluate --result skateboarding_retarget.npz --config run_config.toml
#   uv run retarget view --result skateboarding_retarget.npz --dry-run
#   uv sync --extra viz
#   uv run retarget view --result skateboarding_retarget.npz --live

name = "synthetic_skate_clip"
motion = "data/skate_motion.npz"
format = "minimal"
robot = "synthetic_humanoid"
task_kind = "object_interaction"
output = "skateboarding_retarget.npz"
scale_to_robot = true
output_fps = 30

[scene]
ground_size = 12
ground_range = [-2.0, 2.0]

[scene.object]
name = "skateboard"
sample_points_path = "data/deck_samples.npy"
trajectory_path = "data/board_trajectory.npz"

[solver]
backend = "numpy_least_squares"
max_iterations = 4
trust_radius = 0.2

[[objectives]]
name = "laplacian"
weight = 10.0

[[objectives]]
name = "smoothness"
weight = 0.15

[[constraints]]
name = "joint_limits"

[[constraints]]
name = "trust_region"
