# Real pushoff5_twoshoes clip — fuse first:
#   uv run python examples/skateboarding/fuse_unified.py \
#     --synced ../motion-sync/output/synced/pushoff5_twoshoes/synced.npz \
#     --output examples/skateboarding/data/pushoff5_twoshoes
#
# Run from examples/skateboarding:
#   uv run retarget run --config run_config_pushoff5.toml
#   uv run retarget evaluate --result pushoff5_retarget.npz --config run_config_pushoff5.toml
#   uv run retarget view --result pushoff5_retarget.npz --live --robot-spec ../../.retarget_assets/robot/g1/robot.toml

name = "pushoff5_twoshoes"
motion = "data/pushoff5_twoshoes/skate_motion.npz"
format = "smplx"
robot = "g1"
robot_provider = "asset_store"
task_kind = "object_interaction"
output = "pushoff5_retarget.npz"
scale_to_robot = true
output_fps = 30

[robot_options]
store = "../../.retarget_assets"

[joint_mapping]
L_Foot = "left_ankle_pitch_joint"
R_Foot = "right_ankle_pitch_joint"
L_Hip = "left_hip_pitch_joint"
R_Hip = "right_hip_pitch_joint"
L_Knee = "left_knee_joint"
R_Knee = "right_knee_joint"
Spine1 = "waist_yaw_joint"

[scene]
ground_size = 12
ground_range = [-3.0, 3.0]

[scene.object]
name = "skateboard"
sample_points_path = "data/pushoff5_twoshoes/deck_samples.npy"
trajectory_path = "data/pushoff5_twoshoes/board_trajectory.npz"

[solver]
backend = "numpy_least_squares"
max_iterations = 6
trust_radius = 0.15

[[objectives]]
name = "laplacian"
weight = 10.0

[[objectives]]
name = "smoothness"
weight = 0.15

[[constraints]]
name = "joint_limits"

[[constraints]]
name = "trust_region"
