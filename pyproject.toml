[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retarget"
version = "0.1.0"
description = "A typed, extensible research toolkit for motion retargeting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Rudes" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
optimize = ["cvxpy>=1.5", "clarabel>=0.9"]
mujoco = ["mujoco>=3.2", "trimesh>=4.4"]
viz = ["viser>=0.2", "yourdfpy>=0.0.56", "trimesh>=4.4"]
torch = ["torch>=2.3"]
smpl = ["smplx>=0.1.28"]
eval = ["libigl>=2.5"]
all = [
  "cvxpy>=1.5",
  "clarabel>=0.9",
  "mujoco>=3.2",
  "trimesh>=4.4",
  "viser>=0.2",
  "yourdfpy>=0.0.56",
  "torch>=2.3",
  "smplx>=0.1.28",
  "libigl>=2.5",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
]

[project.scripts]
retarget = "retarget.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retarget"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["retarget"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clarabel", "cvxpy", "mujoco", "scipy.*", "viser", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "assets: optional tests that use a local retarget asset store",
  "slow: slower integration checks",
]
